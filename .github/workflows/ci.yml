name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: |
          pnpm exec prettier --write packages/@webreel/core/src/cdp.ts packages/@webreel/core/src/__tests__/cdp.test.ts
          git diff -- packages/@webreel/core/src/cdp.ts packages/@webreel/core/src/__tests__/cdp.test.ts
          exit 1

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
